<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>transcript deck</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="rec-row">
            <span class="rec-dot" id="recDot"></span>
            <span id="recLabel">STANDBY</span>
        </div>
        <h1>Transcript Deck</h1>
        <p class="subhead">drop a youtube link, pull the parts worth keeping</p>
    </header>

    <div class="scrubber" id="scrubber">
        <div class="scrubber-track"></div>
        <div class="ticks">
            <span>00:00</span><span>00:15</span><span>00:30</span><span>00:45</span><span>01:00</span>
        </div>
    </div>

    <div class="steps">
        <div><span>00:01</span>paste a youtube url</div>
        <div><span>00:02</span>we pull the transcript</div>
        <div><span>00:03</span>an ai reads it, writes the notes</div>
    </div>

    <div class="input-row">
        <input type="text" id="urlInput" placeholder="https://youtube.com/watch?v=...">
        <button id="goBtn" onclick="summarize()">Summarize</button>
    </div>
    <p class="hint">works best on videos with captions turned on</p>

    <div id="entry">
        <div class="entry-meta" id="entryMeta"></div>
        <div id="summaryText"></div>
    </div>

    <div id="error"></div>

    <script>
        async function summarize() {
            const url = document.getElementById("urlInput").value.trim();
            const btn = document.getElementById("goBtn");
            const entry = document.getElementById("entry");
            const errorBox = document.getElementById("error");
            const summaryText = document.getElementById("summaryText");
            const entryMeta = document.getElementById("entryMeta");
            const recDot = document.getElementById("recDot");
            const recLabel = document.getElementById("recLabel");
            const scrubber = document.getElementById("scrubber");

            if (!url) return;

            entry.style.display = "none";
            errorBox.style.display = "none";
            btn.disabled = true;
            recDot.classList.add("live");
            recLabel.textContent = "READING";
            scrubber.classList.add("busy");

            try {
                const response = await fetch("/summarize", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: url })
                });
                const data = await response.json();

                if (data.error) {
                    errorBox.textContent = data.error;
                    errorBox.style.display = "block";
                } else {
                    const now = new Date();
                    const stamp = now.toLocaleTimeString([], { hour12: false });
                    entryMeta.textContent = "notes — " + now.toLocaleDateString() + " " + stamp;
                    summaryText.textContent = data.summary;
                    entry.style.display = "block";
                }
            } catch (err) {
                errorBox.textContent = "couldn't reach the server.";
                errorBox.style.display = "block";
            } finally {
                btn.disabled = false;
                recDot.classList.remove("live");
                recLabel.textContent = "STANDBY";
                scrubber.classList.remove("busy");
            }
        }
    </script>
</body>
</html>
